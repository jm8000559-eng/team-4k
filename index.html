<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM 4K - Portal Oficial & Reclutamiento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #040609 linear-gradient(135deg, #040609 0%, #0a111e 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* LOGO DE FONDO TRANSPARENTE CON EFECTO NEÓN GUAYABITOS/VENEYORK */
        .bg-logo-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            max-width: 650px;
            height: auto;
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 35px #0088ff);
        }

        .card {
            background: rgba(12, 17, 28, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 136, 255, 0.35);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 0 45px rgba(0, 136, 255, 0.2), inset 0 0 15px rgba(0, 136, 255, 0.08);
            position: relative;
            z-index: 1;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0088ff;
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.8);
        }

        h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #0088ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        /* DESCRIPCIÓN DEL CLAN */
        .clan-description {
            background: rgba(0, 136, 255, 0.08);
            border-left: 3px solid #0088ff;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13.5px;
            line-height: 1.5;
            color: #d1e2f5;
        }

        .clan-description strong {
            color: #0088ff;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #c2d1e0;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px 15px;
            background: rgba(5, 8, 14, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0088ff;
            box-shadow: 0 0 14px rgba(0, 136, 255, 0.5);
            background: rgba(5, 8, 14, 0.98);
        }

        select option {
            background-color: #0d131f;
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #0055b3, #0088ff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.45);
            transition: all 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 136, 255, 0.8);
        }
    </style>
</head>
<body>

<!-- LOGO TRANSPARENTE DE FONDO -->
<img src="https://i.ibb.co/1000219027.jpg" alt="Watermark TEAM 4K" class="bg-logo-watermark">

<div class="card">
    <div class="logo-container">
        <img src="https://i.ibb.co/1000219027.jpg" alt="Logo TEAM 4K">
    </div>

    <h1>TEAM 4K</h1>
    
    <!-- DESCRIPCIÓN DEL CLAN -->
    <div class="clan-description">
        Bienvenido al portal del <strong>TEAM 4K</strong>, clan organizado de Roblox fundado y liderado por <strong>Paola</strong>. Operamos activamente en los servidores de Roleplay venezolano como <strong>Guayabitos RP</strong> y <strong>VeneYork</strong>. Si buscas un equipo activo, organizado y con buena convivencia, completa el formulario.
    </div>

    <form id="applyForm">
        <div class="form-group">
            <label for="username">Usuario exacto de Roblox:</label>
            <input type="text" id="username" placeholder="Ej: Player4K_Official" required>
        </div>

        <div class="form-group">
            <label for="discord">Usuario de Discord:</label>
            <input type="text" id="discord" placeholder="Ej: @usuario_4k" required>
        </div>

        <div class="form-group">
            <label for="gender">Rol a postular:</label>
            <select id="gender" required>
                <option value="" disabled selected>Selecciona tu rol</option>
                <option value="4K BOYS">4K BOYS</option>
                <option value="4K GIRLS">4K GIRLS</option>
            </select>
        </div>

        <div class="form-group">
            <label for="age">Edad actual:</label>
            <input type="number" id="age" placeholder="Ej: 16" min="10" max="99" required>
        </div>

        <div class="form-group">
            <label for="tiktok">Perfil / Usuario de TikTok:</label>
            <input type="text" id="tiktok" placeholder="Ej: @tu_usuario_tt" required>
        </div>

        <div class="form-group">
            <label for="server">Servidor donde más juegas Roleplay:</label>
            <select id="server" required>
                <option value="" disabled selected>Selecciona el servidor</option>
                <option value="Guayabitos RP">Guayabitos RP</option>
                <option value="VeneYork RP">VeneYork RP</option>
                <option value="Ambos servidores">Ambos servidores</option>
            </select>
        </div>

        <div class="form-group">
            <label for="motive">¿Por qué quieres unirte al TEAM 4K?</label>
            <textarea id="motive" rows="3" placeholder="Cuéntanos tus motivos..." required></textarea>
        </div>

        <button type="button" class="btn-submit" onclick="sendToWhatsApp()">ENVIAR POSTULACIÓN</button>
    </form>
</div>

<script>
    function sendToWhatsApp() {
        // Coloca el número de teléfono con código de país (Ej: 58 para Venezuela)
        const phone = "580000000000"; 

        const username = document.getElementById("username").value;
        const discord = document.getElementById("discord").value;
        const gender = document.getElementById("gender").value;
        const age = document.getElementById("age").value;
        const tiktok = document.getElementById("tiktok").value;
        const server = document.getElementById("server").value;
        const motive = document.getElementById("motive").value;

        if (!username || !discord || !gender || !age || !tiktok || !server || !motive) {
            alert("Por favor completa todos los campos requeridos.");
            return;
        }

        const message = `🔥 *NUEVA POSTULACIÓN - TEAM 4K* 🔥%0A%0A` +
            `👤 *Roblox:* ${username}%0A` +
            `💬 *Discord:* ${discord}%0A` +
            `👑 *Rol:* ${gender}%0A` +
            `🎂 *Edad:* ${age} años%0A` +
            `📲 *TikTok:* ${tiktok}%0A` +
            `🎮 *Servidor RP:* ${server}%0A` +
            `📝 *Motivo:* ${motive}`;

        window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
    }
</script>

</body>
</html>
